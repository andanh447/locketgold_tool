<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THÍCH CHILL LOCKET - Hệ Thống Nâng Cấp Tự Động</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }
        .panel-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            text-align: center;
        }
        .logo-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }
        h2 {
            margin: 0 0 6px 0;
            font-size: 22px;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .brand-sub {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px;
            background-color: #0b0f19;
            border: 1px solid #374151;
            color: #fff;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            color: #0b0f19;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background-color: #0ea5e9;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .alert {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: left;
            line-height: 1.4;
            display: none;
        }
        .alert.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            display: block;
        }
        .alert.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            display: block;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="panel-card">
        <div class="logo-icon">🎧</div>
        <div class="brand-sub">THÍCH CHILL LOCKET</div>
        <h2>Hệ Thống Gold VIP</h2>
        <div class="desc">Kiểm tra trạng thái và nâng cấp tài khoản tự động độc quyền hoàn toàn.</div>
        
        <div class="input-group">
            <label>Nhập Link hoặc Tên tài khoản Locket:</label>
            <input type="text" id="locketInput" placeholder="Ví dụ: @username hoặc https://locket.cam/..." autocomplete="off">
        </div>

        <button type="button" class="btn-submit" onclick="processUpgrade()">Kiểm Tra & Nâng Cấp Ngay</button>

        <div id="alertBox" class="alert"></div>

        <div class="footer">
            THÍCH CHILL LOCKET • Bảo mật mã nguồn tuyệt đối
        </div>
    </div>

    <script>
        function processUpgrade() {
            var val = document.getElementById('locketInput').value.trim();
            var alertBox = document.getElementById('alertBox');
            
            if(!val) {
                alertBox.className = "alert error";
                alertBox.innerText = "Vui lòng nhập Link hoặc Tên tài khoản Locket!";
                return;
            }

            if(val.length >= 3) {
                alertBox.className = "alert success";
                alertBox.innerText = "Thành công! Tài khoản [" + val + "] đã được kích hoạt gói THÍCH CHILL LOCKET Gold (Hạn: vĩnh viễn).";
            } else {
                alertBox.className = "alert error";
                alertBox.innerText = "Định dạng Link hoặc Tên tài khoản không hợp lệ!";
            }
        }

        // Chống bấm F12 hoặc mở Inspect Element
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        }
    </script>
</body>
</html>

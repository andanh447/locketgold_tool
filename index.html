<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THÍCH CHILL - Hệ Thống Nâng Cấp Locket Gold VIP</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #121826;
            --border-color: #1e293b;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-user-select: none;
            user-select: none;
        }
        .main-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            box-sizing: border-box;
            text-align: center;
        }
        .logo-box {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-radius: 18px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .brand-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
            font-weight: 700;
        }
        .package-box {
            background: #1a2234;
            border: 2px solid var(--accent);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }
        .pkg-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .pkg-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            font-size: 12px;
            color: #cbd5e1;
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent);
        }
        .btn-main {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .btn-main:hover {
            opacity: 0.9;
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        
        /* Trạng thái ẩn hiện các bước */
        #step-upgrade { display: none; }
        
        /* Hiệu ứng thanh tiến trình */
        .loading-container {
            display: none;
            margin-top: 15px;
            text-align: left;
        }
        .log-line {
            font-size: 11px;
            color: #38bdf8;
            font-family: monospace;
            margin-bottom: 6px;
        }
        .progress-track {
            width: 100%;
            background-color: #0b0f19;
            border-radius: 6px;
            overflow: hidden;
            height: 6px;
        }
        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Khung thông báo kết quả */
        .alert-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            display: none;
            text-align: center;
        }
        .alert-box.success {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            display: block;
        }
        .alert-box.error {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            display: block;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 11px;
            color: #4b5563;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="main-card">
        <div class="logo-box">👑</div>
        <h1>THÍCH CHILL</h1>
        <div class="brand-sub">Locket Gold Center System</div>
        
        <div class="package-box">
            <div class="pkg-title">✨ Locket Gold VIP Vĩnh Viễn</div>
            <div class="pkg-desc">Mở khóa toàn bộ khung viền, không quảng cáo, upload ảnh thư viện nét căng.</div>
            
            <div id="step-input">
                <div class="input-group">
                    <label>Nhập Link hoặc Tên tài khoản Locket:</label>
                    <input type="text" id="userInput" placeholder="Ví dụ: @username hoặc https://locket.cam/..." autocomplete="off">
                </div>
                <button type="button" class="btn-main" onclick="verifyAccount()">Kiểm Tra Tài Khoản</button>
            </div>

            <div id="step-upgrade">
                <div id="checkedUser" style="font-size: 12px; color: #34d399; margin-bottom: 12px; font-weight: 500;"></div>
                <button type="button" class="btn-main" style="background: linear-gradient(135deg, #10b981, #059669); color: #fff;" onclick="startGoldInjection()">Bắt Đầu Nâng Cấp Gold</button>
            </div>

            <div class="loading-container" id="loadingArea">
                <div class="log-line" id="logText">Đang thiết lập kết nối mã hóa an toàn...</div>
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <div id="resultAlert" class="alert-box"></div>

        <div class="footer-note">
            Hệ thống tự động hóa 24/7 • Bảo mật tuyệt đối
        </div>
    </div>

    <script>
        let currentAccount = "";

        // Bước 1: Kiểm tra tài khoản
        function verifyAccount() {
            currentAccount = document.getElementById('userInput').value.trim();
            var alertBox = document.getElementById('resultAlert');
            
            if(!currentAccount) {
                alertBox.className = "alert-box error";
                alertBox.innerText = "⚠️ Vui lòng nhập Link hoặc Tên tài khoản Locket!";
                alertBox.style.display = "block";
                return;
            }

            if(currentAccount.length >= 3) {
                alertBox.style.display = "none";
                document.getElementById('step-input').style.display = "none";
                document.getElementById('step-upgrade').style.display = "block";
                document.getElementById('checkedUser').innerHTML = "✅ Đã xác thực tài khoản: <b>" + currentAccount + "</b>";
            } else {
                alertBox.className = "alert-box error";
                alertBox.innerText = "⚠️ Tên tài khoản không hợp lệ!";
                alertBox.style.display = "block";
            }
        }

        // Bước 2: Nâng cấp Gold riêng biệt
        function startGoldInjection() {
            document.getElementById('step-upgrade').style.display = "none";
            var loadingArea = document.getElementById('loadingArea');
            loadingArea.style.display = "block";

            var log = document.getElementById('logText');
            var bar = document.getElementById('progressBar');
            var alertBox = document.getElementById('resultAlert');

            // Kịch bản chạy hiệu ứng tiến trình chuyên nghiệp
            setTimeout(() => { log.innerText = "Đang kết nối Server quản lý tài nguyên..."; bar.style.width = "30%"; }, 800);
            setTimeout(() => { log.innerText = "Đang tiêm mã kích hoạt gói Gold vĩnh viễn..."; bar.style.width = "65%"; }, 2200);
            setTimeout(() => { log.innerText = "Đang đồng bộ hóa trạng thái tài khoản..."; bar.style.width = "90%"; }, 3800);
            
            setTimeout(() => { 
                bar.style.width = "100%";
                loadingArea.style.display = "none";
                alertBox.className = "alert-box success";
                alertBox.innerHTML = "👑 <b>NÂNG CẤP LOCKET GOLD THÀNH CÔNG!</b><br><br><span style='color: #cbd5e1; font-size: 12px;'>Trạng thái: Đã kích hoạt vĩnh viễn.<br><br><strong style='color: #f59e0b;'>⚠️ Vui lòng thoát hoàn toàn app Locket khỏi đa nhiệm rồi vào lại để nhận Gold!</strong></span>";
            }, 5000);
        }

        // Chống xem mã nguồn (F12, chuột phải)
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        }
    </script>
</body>
</html>

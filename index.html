<!DOCTYPE html>
<html lang="vi">
<head>

    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 32px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #f0b90b; margin: 0 0 20px 0; font-size: 22px; }

        input:focus { border-color: #f0b90b; }
        button { width: 100%; padding: 14px; background: #f0b90b; color: #000; font-weight: bold; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d4a207; }
        #box2, #box3 { display: none; }
        .spinner { width: 30px; height: 30px; border: 3px solid #30363d; border-top: 3px solid #f0b90b; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .log { color: #58a6ff; font-size: 13px; font-family: monospace; }
        .success { color: #3fb950; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>

</html>

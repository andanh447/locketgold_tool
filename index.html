<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold Auto-Config</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            box-sizing: border-box;
            transition: 0.2s;
            margin-bottom: 12px;
        }
        .btn:hover { background-color: #0ea5e9; }
        .btn-outline {
            background-color: transparent;
            color: #f1f5f9;
            border: 1px solid #374151;
        }
        .btn-outline:hover { background-color: #1f2937; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Locket Gold 1111</h2>
        <p>Hệ thống tự động kích hoạt VIP và khung viền không cần thao tác phức tạp.</p>
        
        <!-- Nút bấm tự động tạo gói cấu hình và ném thẳng vào Shadowrocket -->
        <a href="#" id="autoConfigBtn" class="btn">🚀 Cài Đặt Tự Động</a>
        
        <!-- Nút phụ để xem mã nguồn code trực tiếp trên web -->
        <button onclick="viewSourceCode()" class="btn btn-outline">📄 Xem Đoạn Code Chạy Ngầm</button>
    </div>

    <script>
        // Đoạn code cấu hình module được nhúng trực tiếp ngầm trong web
        const moduleContent = `#!name=Locket Gold VIP 1111
#!desc=Tu dong kich hoat Locket Gold han 1111
#!system=ios

[MITM]
hostname = %APPEND% api.revenuecat.com

[Script]
LocketGold = type=http-response, pattern=^https:\\/\\/api\\.revenuecat\\.com\\/.+\\/(receipts$|subscribers\\/[^/]+$), script-path=https://raw.githubusercontent.com/andanh447/locketgolddocquyendht/refs/heads/main/locketgoldtest.js, requires-body=true, max-size=-1, timeout=60
`;

        // Tự động mã hóa nội dung code thành đường dẫn dạng base64 để truyền trực tiếp qua giao thức app
        const encodedConfig = btoa(unescape(encodeURIComponent(moduleContent)));
      document.getElementById('autoConfigBtn').href = "sub://" + encodedConfig;

        function viewSourceCode() {
            alert("Nội dung code đang chạy ngầm trong trang web này:\n\n" + moduleContent);
        }
    </script>

</body>
</html>

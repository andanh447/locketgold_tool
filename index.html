<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THÍCH CHILL LOCKET - Hệ Thống Kích Hoạt</title>
    <!-- Import font chữ uốn lượn cho Logo giống hệt ảnh -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* Màu nền xanh tím than giống hệt ảnh */
            background: radial-gradient(circle at top, #2b3266, #141736);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Tái tạo Thanh Menu (Navbar) y hệt ảnh */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 30px;
            background-color: rgba(30, 35, 70, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            font-weight: bold;
        }
        .nav-links {
            display: flex;
            gap: 25px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.4);
            padding-bottom: 6px;
        }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .nav-right { display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Khung chính giữa màn hình */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background-color: #3b4486; /* Màu nền ô giữa y hệt ảnh */
            padding: 35px 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .card-icon { font-size: 28px; margin-bottom: 5px; }
        h2 { margin: 0 0 5px 0; font-size: 20px; }
        .subtitle { font-size: 12px; color: #b0b8e0; margin-bottom: 25px; }

        /* Khung nhập liệu giống ảnh */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-row input {
            flex: 1;
            background-color: #272f60;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 12px 15px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .input-row input::placeholder { color: #6a74a5; }
        .input-row input:focus { border: 1px solid #6b7bd4; }
        .btn-small {
            background-color: #4f5b9d;
            border: none;
            color: white;
            border-radius: 10px;
            padding: 0 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-small:hover { background-color: #5d6ab0; }

        /* Nút Kích hoạt to dưới cùng (Trạng thái tắt & bật) */
        .btn-main {
            width: 100%;
            background-color: #2a3265; /* Đang bị chìm giống ảnh */
            color: #5c6699;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            cursor: not-allowed;
            transition: 0.3s;
        }
        .btn-main.active {
            background-color: #5465c4;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(84, 101, 196, 0.4);
        }

        .footer-text { font-size: 11px; color: #8b95c7; margin-top: 25px; }

        /* Khu vực giả lập Loading ngầm */
        #loadingArea { display: none; margin-top: 15px; text-align: left; }
        .log-text { font-size: 12px; color: #9ab4ff; font-family: monospace; margin-bottom: 8px; }
        .progress-bg { width: 100%; background: #272f60; height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: #10b981; width: 0%; transition: width 0.3s; }
        
        #successArea { 
            display: none; 
            margin-top: 20px; 
            background: rgba(16, 185, 129, 0.1); 
            border: 1px solid #10b981; 
            padding: 15px; 
            border-radius: 10px; 
            color: #34d399; 
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Thanh Menu Navbar Y Hệt Ảnh -->
    <div class="navbar">
        <div class="logo">🤍 THÍCH CHILL</div>
        <div class="nav-links">
            <a href="#">Trang chủ</a>
            <a href="#" style="color: #a7b7ff;">Kích hoạt</a>
            <a href="#">Hướng dẫn</a>
            <a href="#">Bảng giá</a>
            <a href="#">Bài viết</a>
            <a href="#">Liên hệ</a>
        </div>
        <div class="nav-right">
            <button class="nav-btn">Đăng nhập 🚪</button>
            <button class="nav-btn">👤 Tài khoản ▾</button>
        </div>
    </div>

    <!-- Khung chức năng chính -->
    <div class="main-container">
        <div class="card">
            <div id="step-form">
                <div class="card-icon">🤍</div>
                <h2>Locket Gold</h2>
                <div class="subtitle">Nhập username để bắt đầu kích hoạt</div>
                
                <div class="input-row">
                    <input type="text" id="keyInput" placeholder="Nhập key kích hoạt (LG-XXXXXX-XXXXX)">
                    <button class="btn-small">Kích hoạt</button>
                </div>
                
                <div class="input-row">
                    <input type="text" id="usernameInput" placeholder="username hoặc link locket..." autocomplete="off">
                    <button class="btn-small" onclick="findAccount()">Tìm</button>
                </div>
                
                <button id="btnSubmit" class="btn-main" disabled onclick="startHack()">Kích hoạt Locket Gold</button>
            </div>

            <!-- Khu vực hiệu ứng Load -->
            <div id="loadingArea">
                <div class="log-text" id="logText">Đang khởi tạo kết nối an toàn...</div>
                <div class="progress-bg"><div class="progress-bar" id="progressBar"></div></div>
            </div>

            <!-- Thông báo thành công -->
            <div id="successArea"></div>

            <div class="footer-text">Locket Gold By THÍCH CHILL • Đăng nhập</div>
        </div>
    </div>

    <script>
        // Hàm 1: Bấm "Tìm" để check tài khoản và mở khóa nút Kích hoạt
        function findAccount() {
            let user = document.getElementById('usernameInput').value.trim();
            let btnSubmit = document.getElementById('btnSubmit');
            
            if(user.length >= 3) {
                // Đổi trạng thái nút chính thành bật (sáng lên)
                btnSubmit.disabled = false;
                btnSubmit.classList.add("active");
                alert("✅ Đã tìm thấy tài khoản: " + user + "\nBạn có thể bấm Kích Hoạt ngay bây giờ!");
            } else {
                alert("⚠️ Vui lòng nhập Username hợp lệ!");
                btnSubmit.disabled = true;
                btnSubmit.classList.remove("active");
            }
        }

        // Hàm 2: Bấm "Kích hoạt Locket Gold" để chạy mã ngầm
        function startHack() {
            document.getElementById('step-form').style.display = "none";
            document.getElementById('loadingArea').style.display = "block";

            let log = document.getElementById('logText');
            let bar = document.getElementById('progressBar');
            let success = document.getElementById('successArea');

            // Chạy hiệu ứng mượt mà
            setTimeout(() => { log.innerText = "Đang tiêm mã VIP Gold vào Server..."; bar.style.width = "40%"; }, 1000);
            setTimeout(() => { log.innerText = "Đồng bộ hóa dữ liệu tài khoản..."; bar.style.width = "75%"; }, 2500);
            
            setTimeout(() => { 
                bar.style.width = "100%";
                document.getElementById('loadingArea').style.display = "none";
                success.style.display = "block";
                success.innerHTML = "👑 <b>KÍCH HOẠT THÀNH CÔNG!</b><br><br><span style='color: white;'>Tài khoản của bạn đã được nâng cấp Locket Gold vĩnh viễn.<br><b style='color: #f59e0b;'>Hãy thoát app hoàn toàn và vào lại để nhận Gold nhé!</b></span>";
            }, 4000);
        }

        // Khóa F12 và chuột phải để bảo vệ giao diện
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        }
    </script>
</body>
</html>
